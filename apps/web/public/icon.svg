<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Store / POS Icon Graphic -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Roof / Awning -->
    <path d="M 24 100 L 160 20 L 296 100 L 24 100 Z" fill="url(#roof)"/>
    
    <!-- Awning Scallops / Store Front Striping -->
    <rect x="40" y="100" width="240" height="24" rx="6" fill="#f8fafc"/>
    <path d="M 40 124 Q 60 144 80 124 Q 100 144 120 124 Q 140 144 160 124 Q 180 144 200 124 Q 220 144 240 124 Q 260 144 280 124" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>

    <!-- Building Body -->
    <rect x="52" y="132" width="216" height="152" rx="12" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Store Door -->
    <rect x="124" y="196" width="72" height="88" rx="8" fill="#1e293b"/>
    <circle cx="182" cy="240" r="5" fill="#f59e0b"/>
    
    <!-- Windows -->
    <rect x="72" y="160" width="40" height="52" rx="6" fill="#38bdf8" fill-opacity="0.85"/>
    <rect x="208" y="160" width="40" height="52" rx="6" fill="#38bdf8" fill-opacity="0.85"/>
    <line x1="92" y1="160" x2="92" y2="212" stroke="#ffffff" stroke-width="3"/>
    <line x1="228" y1="160" x2="228" y2="212" stroke="#ffffff" stroke-width="3"/>

    <!-- Shopping Cart / Barcode Badge -->
    <circle cx="160" cy="56" r="28" fill="#f59e0b"/>
    <path d="M 150 48 L 154 48 L 158 64 L 170 64 L 174 54 L 155 54" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="69" r="2.5" fill="#ffffff"/>
    <circle cx="168" cy="69" r="2.5" fill="#ffffff"/>
  </g>
</svg>
