services:
  # ============================================================
  # 1. Primary Live PostgreSQL Database (Single Source of Truth)
  # ============================================================
  postgres_live:
    image: postgres:16-alpine
    container_name: shop_postgres_live
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-shop_live_db}
      POSTGRES_USER: ${DB_USER:-shop_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop_secure_password_2026}
    volumes:
      # HOST BIND MOUNT: Data persists on host — survives container deletion
      - ./data/postgres_live:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # Localhost only; never exposed to public WAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shop_admin} -d ${DB_NAME:-shop_live_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - shop_network

  # ============================================================
  # 2. Secondary Recovery PostgreSQL Database (Standby & Restore Testing)
  # ============================================================
  postgres_recovery:
    image: postgres:16-alpine
    container_name: shop_postgres_recovery
    restart: always
    environment:
      POSTGRES_DB: ${RECOVERY_DB_NAME:-shop_recovery_db}
      POSTGRES_USER: ${RECOVERY_DB_USER:-recovery_admin}
      POSTGRES_PASSWORD: ${RECOVERY_DB_PASSWORD:-recovery_secure_password_2026}
    volumes:
      # HOST BIND MOUNT: Recovery data stored on host disk
      - ./data/postgres_recovery:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECOVERY_DB_USER:-recovery_admin} -d ${RECOVERY_DB_NAME:-shop_recovery_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - shop_network

  # ============================================================
  # 3. Node.js Fastify API Backend Server
  # ============================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: shopmanagement-api:latest
    container_name: shop_api
    restart: always
    depends_on:
      postgres_live:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-shop_admin}:${DB_PASSWORD:-shop_secure_password_2026}@postgres_live:5432/${DB_NAME:-shop_live_db}
      RECOVERY_DATABASE_URL: postgresql://${RECOVERY_DB_USER:-recovery_admin}:${RECOVERY_DB_PASSWORD:-recovery_secure_password_2026}@postgres_recovery:5432/${RECOVERY_DB_NAME:-shop_recovery_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_shop_management_ksa_2026_xyz}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-shop_backup_master_key_32_chars!}
      SHOP_NAME: ${SHOP_NAME:-AL-NOOR RETAIL SHOP}
      SHOP_VAT_NUMBER: ${SHOP_VAT_NUMBER:-300123456700003}
      SHOP_CR_NUMBER: ${SHOP_CR_NUMBER:-1010123456}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      # HOST BIND MOUNTS: All data on host filesystem — container-safe
      - ./backups:/app/backups
      - ./data/uploads:/app/uploads
      - ./data/logs/api:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - shop_network

  # ============================================================
  # 4. Next.js Web Frontend (POS & Manager Dashboard)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: shopmanagement-web:latest
    container_name: shop_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: http://api:5000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - shop_network

  # ============================================================
  # 5. Nginx Reverse Proxy (Unified Shop LAN Gateway on Port 80)
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: shop_nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    ports:
      # Single LAN entrypoint — all devices connect here
      - "80:80"     # Shop LAN single entrypoint (http://192.168.x.x)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - shop_network

  # ============================================================
  # 6. CloudBeaver Web GUI (DBeaver Web Database Manager)
  # ============================================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: shop_cloudbeaver
    restart: always
    depends_on:
      postgres_live:
        condition: service_healthy
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    ports:
      - "8978:8978"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8978 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - shop_network

# ============================================================
# Named Volumes (for CloudBeaver workspace & preferences)
# ============================================================
volumes:
  cloudbeaver_data:
    driver: local

# ============================================================
# Network Configuration
# ============================================================
networks:
  shop_network:
    driver: bridge
    name: shop_management_network

# ============================================================
# DATA PERSISTENCE NOTE:
# All data uses HOST BIND MOUNTS (not Docker volumes).
# This means:
#   ✅ docker compose down         → Data SAFE
#   ✅ docker compose up --build   → Data SAFE
#   ✅ docker system prune         → Data SAFE
#   ✅ Container rebuild/update    → Data SAFE
#   ❌ Deleting ./data/ folder     → DATA LOST
#   ❌ Formatting host drive       → DATA LOST
# ============================================================
